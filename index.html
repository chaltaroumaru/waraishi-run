<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9d3cb">
<title>わらいしくんラン ～高松から宇宙まで走れ！～</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #d9d3cb; overflow: hidden; touch-action: manipulation; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  canvas { display: block; }
  #mute {
    position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
    border: 2px solid #2e2e2e; border-radius: 50%; background: #f4f1ec;
    font-size: 18px; cursor: pointer; z-index: 2;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="音のオン・オフ">🔊</button>
</div>
<script>
(() => {
  // ===== 基本設定 =====
  const W = 400, H = 700;            // 論理解像度(縦長スマホ向け)
  const GROUND = 560;                // 走る道のY座標
  const RIVER_TOP = 452, RIVER_BOTTOM = 506; // 春日川の水面
  const COL = { light: '#d9d3cb', mid: '#b3aa9c', dark: '#2e2e2e', pink: '#ebcaca', paper: '#f4f1ec', side: '#a59c8e' };
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let scale = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== わらいしくんの絵(キャラクター資料から切り出したもの) =====
  const IMG = {};
  ['head_main', 'head_happy', 'head_surprise', 'head_tehe', 'head_sad', 'torso'].forEach(n => {
    const im = new Image(); im.src = `assets/sprites/${n}.png`; IMG[n] = im;
  });
  const FACE_IMG = { normal: 'head_main', happy: 'head_happy', surprise: 'head_surprise', tehe: 'head_tehe', sad: 'head_sad' };
  const ready = im => im && im.complete && im.naturalWidth > 0;

  // ===== サウンド =====
  let audio = null, muted = localStorage.getItem('waraishi_mute') === '1';
  const muteBtn = document.getElementById('mute');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.addEventListener('pointerdown', e => {
    e.stopPropagation();
    muted = !muted;
    localStorage.setItem('waraishi_mute', muted ? '1' : '0');
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (muted) stopMusic(0.2); else if (S.mode === 'play') startMusic();
  });
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (_) {}
  }


  // ===== BGM =====
  // 使いたい曲: 「情動カタルシス」(作曲: まんぼう二等兵 / フリーBGM OpenTracks ※旧DOVA-SYNDROME)
  // OpenTracksの規約では、利用者が音源ファイルを取り出せる状態での組み込み・音源の再配布が禁止されている。
  // そのため mp3 は公開リポジトリには入れない(.gitignore で assets/bgm/ を除外)。
  // assets/bgm/bgm.mp3 が置いてあるときだけそれを流し、無いときはゲーム内で自動演奏するオリジナル曲を流す。
  const BGM_FILE = 'assets/bgm/bgm.mp3';
  const BGM_LOOP = [6.486, 129.729];   // 曲ページに記載のループ位置(始点・終点 秒)
  const Music = { buf: null, tried: false, src: null, gain: null, timer: null, playing: false, next: 0, step: 0 };
  const musicKind = () => (Music.buf ? 'file' : 'synth');
  function ensureAudio() {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    return audio;
  }
  async function loadBgm() {
    if (Music.tried) return;
    Music.tried = true;
    try {
      const r = await fetch(BGM_FILE, { cache: 'no-store' });
      if (!r.ok) return;
      const data = await r.arrayBuffer();
      const buf = await new Promise((ok, ng) => ensureAudio().decodeAudioData(data, ok, ng));
      Music.buf = buf;
      if (Music.playing) { stopMusic(0.2); setTimeout(startMusic, 260); }  // 合成音から差し替え
    } catch (_) { /* ファイルが無い・読めないときはオリジナル曲のまま */ }
  }
  function startMusic() {
    if (muted || Music.playing) return;
    const ac = ensureAudio();
    Music.playing = true;
    Music.gain = ac.createGain();
    Music.gain.gain.setValueAtTime(0.0001, ac.currentTime);
    Music.gain.gain.linearRampToValueAtTime(Music.buf ? 0.45 : 0.22, ac.currentTime + 0.6);
    Music.gain.connect(ac.destination);
    if (Music.buf) {
      const s = ac.createBufferSource();
      s.buffer = Music.buf; s.loop = true;
      s.loopStart = BGM_LOOP[0]; s.loopEnd = Math.min(BGM_LOOP[1], Music.buf.duration);
      s.connect(Music.gain); s.start();
      Music.src = s;
    } else {
      Music.next = ac.currentTime + 0.05; Music.step = 0;
      Music.timer = setInterval(scheduleSynth, 25);
    }
  }
  function stopMusic(fade = 0.5) {
    if (!Music.playing) return;
    Music.playing = false;
    clearInterval(Music.timer); Music.timer = null;
    const ac = audio, g = Music.gain, s = Music.src;
    Music.src = null;
    g.gain.cancelScheduledValues(ac.currentTime);
    g.gain.setValueAtTime(g.gain.value, ac.currentTime);
    g.gain.linearRampToValueAtTime(0.0001, ac.currentTime + fade);
    setTimeout(() => { try { s && s.stop(); } catch (_) {} g.disconnect(); }, fade * 1000 + 80);
  }

  // --- オリジナル曲(チップチューン風・自作) 150BPM / 8分音符で64ステップのループ ---
  const N = n => 440 * Math.pow(2, (n - 69) / 12);
  const LEAD = [
    72, 0, 76, 79, 76, 0, 74, 72,   69, 0, 72, 76, 74, 72, 69, 0,
    65, 69, 72, 0, 77, 76, 74, 72,  74, 0, 71, 74, 79, 0, 0, 0,
    72, 74, 76, 0, 79, 0, 81, 79,   76, 0, 72, 0, 74, 76, 72, 0,
    77, 0, 76, 74, 72, 0, 69, 72,   71, 0, 74, 0, 79, 77, 76, 74,
  ];
  const ROOT = [48, 45, 41, 43, 48, 45, 41, 43];   // C - Am - F - G を2回
  let noiseBuf = null;
  function playNote(type, freq, t, dur, vol) {
    const ac = audio, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(Music.gain); o.start(t); o.stop(t + dur + 0.02);
  }
  function playKick(t) {
    const ac = audio, o = ac.createOscillator(), g = ac.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    o.connect(g).connect(Music.gain); o.start(t); o.stop(t + 0.16);
  }
  function playHat(t, vol) {
    const ac = audio;
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.05, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
    s.connect(f).connect(g).connect(Music.gain); s.start(t);
  }
  function scheduleSynth() {
    if (!Music.playing || !Music.gain) return;
    const ac = audio, step8 = 60 / 150 / 2;
    while (Music.next < ac.currentTime + 0.12) {
      const i = Music.step % 64, t = Music.next;
      const root = ROOT[Math.floor(i / 8)];
      playNote('triangle', N(root + (i % 2 ? 12 : 0)), t, step8 * 0.9, 0.55);      // ベース
      if (LEAD[i]) playNote('square', N(LEAD[i]), t, step8 * 0.85, 0.16);          // メロディ
      if (i % 4 === 0) playKick(t);
      playHat(t, i % 2 ? 0.25 : 0.12);
      Music.next += step8; Music.step++;
    }
  }

  // ===== 庵治石まめちしき(ゲームオーバー時に1つ表示) =====
  const TRIVIA = [
    '庵治石(あじいし)は香川県高松市の庵治町・牟礼町でとれる花崗岩だよ。',
    '庵治石は「花崗岩のダイヤモンド」とも呼ばれているんだ。',
    'みがくと浮かび上がる、まだらなかすり模様を「斑(ふ)」と呼ぶよ。',
    '庵治石はきめが細かくてかたいから、細かい彫刻もくっきり長持ち！',
    '雨や風に強く、長い年月がたっても風合いが変わりにくいのが自慢。',
    '庵治石の産地は、五剣山(ごけんざん)のふもとに広がっているよ。',
    '灯籠(とうろう)や彫刻、インテリアにも庵治石が使われているんだ。',
    '庵治・牟礼には、石を切り出し・加工する職人さんがたくさんいるよ。',
  ];

  // ===== 香川の特産品(たまに出てくるボーナスアイテム) =====
  const SPECIALS = [
    { id: 'udon',   name: '讃岐うどん', text: '香川といえば うどん！「うどん県」と名乗るほど！' },
    { id: 'glove',  name: '手袋',       text: '東かがわ市は、日本一の手袋の産地なんだ！' },
    { id: 'olive',  name: 'オリーブ',   text: '小豆島は、日本のオリーブ栽培発祥の地！' },
    { id: 'chicken',name: '骨付鳥',     text: '丸亀生まれ！スパイスのきいた鶏もも焼き' },
    { id: 'uchiwa', name: '丸亀うちわ', text: '丸亀は、うちわの生産量が全国トップクラス！' },
  ];
  const SPECIAL_BONUS = 100;
  const GRAVE_EVERY = 5000;   // 歩く墓石は500mごと(きょり表示は dist/10 m)
  const GRAVE_WALK = 1.8;     // 墓石が自分で歩いてくる速さ(スクロールに上乗せ)

  // ===== このスマホに残す記録(ランキング上位10件・これまでに集めたアイテム) =====
  const RANK_MAX = 10;
  function loadJSON(key, fallback) {
    try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch (_) { return fallback; }
  }
  const SAVE = {
    rank: loadJSON('waraishi_rank', []),     // [{ score, m, stones, sp, date }]
    items: loadJSON('waraishi_items', {}),   // { stones: 合計, udon: 回数, ... }
  };
  function saveAll() {
    localStorage.setItem('waraishi_rank', JSON.stringify(SAVE.rank));
    localStorage.setItem('waraishi_items', JSON.stringify(SAVE.items));
  }
  const MENU_MODES = ['home', 'start', 'ranking', 'items', 'credits'];
  const inMenu = () => MENU_MODES.includes(S.mode);

  // ===== ステージ(だいたい1000mごと) =====
  const STAGES = [
    { name: '高松大学', at: 0 },
    { name: '高松駅', at: 1000 },
    { name: '高松空港', at: 2000 },
    { name: '東京スカイツリー', at: 3000 },
    { name: '東京タワー', at: 4000 },
    { name: '宇宙', at: 5000 },
  ];
  const meters = () => Math.floor(S.dist / 10);
  function stageOf(m) { let i = 0; STAGES.forEach((st, k) => { if (m >= st.at) i = k; }); return i; }

  // ===== ゲーム状態 =====
  const S = {
    mode: 'home',        // home | start | ranking | items | play | over
    t: 0, speed: 0, dist: 0, score: 0, stones: 0, bonus: 0, got: [],
    best: Number(localStorage.getItem('waraishi_best') || 0),
    runCount: {}, rankPos: 0, buttons: [],
    obstacles: [], items: [], specials: [], particles: [], clouds: [],
    spawnT: 0, itemT: 0, specialT: 0, trivia: '', overT: 0, newBest: false, shake: 0,
    banner: null,          // 特産品をとったときの表示
    landmark: { stage: 0, x: 170 },  // 各ステージの名所(スタートは高松大学)
    prevLandmark: null, stage: 0, prevStage: 0, stageT: 999, stageBanner: null,
    landmarkT: 0, signX: 120, scroll: 0,
  };
  const P = { x: 90, y: GROUND, vy: 0, jumps: 0, onGround: true, face: 'normal', faceT: 0, run: 0, squash: 0 };

  for (let i = 0; i < 4; i++) S.clouds.push({ x: Math.random() * W, y: 50 + Math.random() * 170, s: 0.6 + Math.random() * 0.6 });

  function reset() {
    Object.assign(S, {
      mode: 'play', t: 0, speed: 5.2, dist: 0, score: 0, stones: 0, bonus: 0, got: [],
      obstacles: [], items: [], specials: [], particles: [], spawnT: 60, itemT: 90,
      specialT: 420 + Math.random() * 240, newBest: false, banner: null,
      landmark: { stage: 0, x: 170 }, prevLandmark: null, landmarkT: 1500, signX: 620,
      stage: 0, prevStage: 0, stageT: 999, stageBanner: null,
      nextGrave: GRAVE_EVERY, graveAlert: 0, graveCount: 0, runCount: {}, rankPos: 0,
    });
    Object.assign(P, { y: GROUND, vy: 0, jumps: 0, onGround: true, face: 'normal', faceT: 0 });
  }

  // ===== 入力 =====
  // 画面を切り替えたら、前の画面のボタンは無効にする(次の描画で登録し直す)
  function go(mode) {
    if (S.mode === 'over') {   // ゲームオーバーからメニューへ: 景色をスタート地点に戻す
      Object.assign(S, { stage: 0, prevStage: 0, stageT: 999, landmark: { stage: 0, x: 170 }, prevLandmark: null,
        obstacles: [], items: [], specials: [], signX: 620 });
    }
    S.mode = mode; S.buttons = []; stopMusic(); beep(660, 0.08, 'triangle', 0.07);
  }
  function startGame() { reset(); S.buttons = []; beep(660, 0.12); startMusic(); }
  // 画面上のボタン(描画のたびに S.buttons に登録される)
  function hitButton(x, y) {
    for (let i = S.buttons.length - 1; i >= 0; i--) {
      const b = S.buttons[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return true; }
    }
    return false;
  }
  function press(x, y) {
    if (S.mode !== 'play') {
      if (x !== undefined && hitButton(x, y)) return;
      if (S.mode === 'start') startGame();   // スタート画面はどこをタップしても開始
      return;
    }
    if (P.jumps < 2) {
      P.vy = P.jumps === 0 ? -15.5 : -13;
      P.jumps++; P.onGround = false;
      setFace('surprise', 18);
      beep(P.jumps === 1 ? 420 : 560, 0.15, 'square', 0.06, 300);
      for (let i = 0; i < 6; i++) dust(P.x, P.y);
    }
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    ensureAudio(); loadBgm();
    const r = canvas.getBoundingClientRect();
    press((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') {
      e.preventDefault(); if (e.repeat) return;
      if (S.mode === 'play') press();
      else if (S.mode === 'home') go('start');
      else if (S.mode === 'start') startGame();
      else if (S.mode === 'over' && S.overT > 40) startGame();
      else if (S.mode === 'ranking' || S.mode === 'items') go('home');
    }
    if (e.code === 'Escape' && S.mode !== 'play') go('home');
  });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  function setFace(f, t) { P.face = f; P.faceT = t; }
  function dust(x, y) {
    S.particles.push({ x: x + (Math.random() - 0.5) * 30, y, vx: -1 - Math.random() * 2, vy: -Math.random() * 2, life: 25, r: 3 + Math.random() * 4, c: COL.mid });
  }
  function sparkle(x, y, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 3;
      S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30, r: 2 + Math.random() * 3, c: i % 2 ? '#f2c94c' : COL.paper });
    }
  }

  // ===== 障害物・アイテムの出現 =====
  function spawnObstacle() {
    const lvl = Math.min(1, S.dist / 6000);
    const r = Math.random();
    let o;
    if (r < 0.35) o = { type: 'rocks', w: 46, h: 34 };
    else if (r < 0.65) o = { type: 'lantern', w: 40, h: 78 };
    else if (r < 0.85 && S.dist > 800) o = { type: 'crow', w: 44, h: 26, fy: GROUND - 130 - Math.random() * 40, flap: 0 };
    else o = { type: 'rocks', w: 70, h: 40 };
    o.x = W + 20;
    S.obstacles.push(o);
    S.spawnT = (95 - lvl * 35) + Math.random() * 55;
    if (lvl > 0.3 && Math.random() < 0.25 && o.type === 'rocks') {
      S.obstacles.push({ type: 'rocks', w: 46, h: 34, x: o.x + o.w + 150 + S.speed * 6 });
      S.spawnT += 40;
    }
  }
  function spawnItem() {
    const high = Math.random() < 0.5;
    S.items.push({ x: W + 20, y: high ? GROUND - 180 : GROUND - 80, r: 13, t: 0 });
    S.itemT = 70 + Math.random() * 90;
  }
  function spawnSpecial() {
    // まだとっていない特産品を優先して出す
    const left = SPECIALS.filter(s => !S.got.includes(s.id));
    const pool = left.length ? left : SPECIALS;
    const sp = pool[Math.floor(Math.random() * pool.length)];
    S.specials.push({ ...sp, x: W + 30, y: GROUND - 150 - Math.random() * 50, t: 0 });
    S.specialT = 480 + Math.random() * 300; // 約8〜13秒に1回
  }

  // 500mごとに歩く墓石がやってくる
  function spawnGrave() {
    S.nextGrave += GRAVE_EVERY;
    S.graveCount++;
    // 理不尽な組み合わせにならないよう、画面右端付近の障害物は片付けて間隔をあける
    S.obstacles = S.obstacles.filter(o => o.x < W - 160);
    S.obstacles.push({ type: 'grave', w: 46, h: 90, x: W + 30, walk: 0 });
    S.spawnT = Math.max(S.spawnT, 85);
    S.graveAlert = 100;
    beep(220, 0.18, 'square', 0.06); setTimeout(() => beep(220, 0.18, 'square', 0.06), 220);
  }

  function hitbox(o) {
    if (o.type === 'crow') return { x: o.x + 6, y: o.fy - o.h / 2 + 4, w: o.w - 12, h: o.h - 8 };
    if (o.type === 'lantern') return { x: o.x + 8, y: GROUND - o.h + 6, w: o.w - 16, h: o.h - 6 };
    if (o.type === 'grave') return { x: o.x + 8, y: GROUND - o.h + 6, w: o.w - 16, h: o.h - 6 };
    return { x: o.x + 5, y: GROUND - o.h + 8, w: o.w - 10, h: o.h - 8 };
  }
  // 頭+胴をざっくり。少し小さめにして理不尽な当たりを防ぐ
  const playerBox = () => ({ x: P.x - 26, y: P.y - 104, w: 52, h: 98 });
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const near = (pb, x, y, r) => x > pb.x - r && x < pb.x + pb.w + r && y > pb.y - r && y < pb.y + pb.h + r;

  // ===== 更新 =====
  function update() {
    S.t++;
    const spd = S.mode === 'play' ? S.speed : (inMenu() ? 2.5 : 0);
    S.scroll += spd;
    S.clouds.forEach(c => { c.x -= spd * 0.08 * c.s; if (c.x < -100) { c.x = W + 60; c.y = 50 + Math.random() * 170; } });
    S.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
    S.particles = S.particles.filter(p => p.life > 0);
    if (S.shake > 0) S.shake--;
    if (S.banner && --S.banner.t <= 0) S.banner = null;

    // 景色: 春日川の看板と高松大学
    S.signX -= spd * 0.3;  // 看板と校舎は同じ向こう岸なので同じ速さで流す
    if (S.signX < -140) S.signX = W + 900 + Math.random() * 600;

    if (S.dist >= S.nextGrave) spawnGrave();

    const pb = playerBox();
    for (const o of S.obstacles) {

      if (o.type === 'crow') o.flap += 0.3;

        S.banner = { name: sp.name, text: sp.text, id: sp.id, t: 150, first };
        [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.08), i * 70));

  // ===== 歩く墓石(和型: 竿石 + 上台 + 中台 に足が生えている) =====

  // ===== ステージ(だいたい1000mごとに景色が変わる) =====
  // 高松大学(春日川) → 高松駅 → 高松空港 → 東京スカイツリー → 東京タワー → 宇宙
  function drawSky(top, bottom, toY = 440) {

  function drawClouds(color = '#ffffff') {

  // 地面(タイル模様)
  function drawGround(fill, lineCol, edge = COL.dark, tile = 80) {
    ctx.fillStyle = fill; ctx.fillRect(0, GROUND, W, H - GROUND);
    line(2.5, edge); ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
    const off = wrapX(-S.scroll, tile);
    ctx.strokeStyle = lineCol; ctx.lineWidth = 1.5;
    for (let row = 0; row < 3; row++) {
      const y = GROUND + 18 + row * 40;
      ctx.beginPath(); ctx.moveTo(0, y + 22); ctx.lineTo(W, y + 22); ctx.stroke();
      for (let x = off - tile + (row % 2) * tile / 2; x < W + tile; x += tile) {
        ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x, y + 22); ctx.stroke();
      }

  }
  // ビル街のシルエット(seedで形を固定)
  function drawSkyline(baseY, span, par, color, maxH, seed, windows) {
    const off = wrapX(-S.scroll * par, span);
    for (let k = -1; k < 2; k++) {
      let s = seed, x = off + k * span;
      const end = x + span;
      while (x < end) {
        s = (s * 9301 + 49297) % 233280; const bw = 26 + (s / 233280) * 34;
        s = (s * 9301 + 49297) % 233280; const bh = maxH * (0.35 + (s / 233280) * 0.65);
        ctx.fillStyle = color; ctx.fillRect(x, baseY - bh, bw - 3, bh);
        if (windows) {
          ctx.fillStyle = windows;
          for (let wy = baseY - bh + 6; wy < baseY - 6; wy += 10)
            for (let wx = x + 4; wx < x + bw - 8; wx += 8)
              if (((wx * 7 + wy * 3) | 0) % 5 < 3) ctx.fillRect(wx, wy, 3, 4);
        }
        x += bw;
      }
    }
  }
  function streetLamps(color = '#6e655a') {

  function nameBoard(label, sub, cx, y, bg = '#2e5a8a') {

    text(label, cx, y + (sub ? 12 : 13), 15, '#fff');

  }

  // --- 1: 高松駅(港と瀬戸内海) ---

    line(2); ctx.beginPath(); ctx.moveTo(tx + 23, base - 250); ctx.lineTo(tx + 23, base - 275); ctx.stroke();
    // 駅舎(大きなアーチ窓)
    ctx.fillStyle = '#f1ece2'; line(2);

    ctx.quadraticCurveTo(x + 115, base - 120, x + 200, base - 50); ctx.lineTo(x + 200, base); ctx.closePath(); ctx.fill(); ctx.stroke();

    nameBoard('高松駅', 'TAKAMATSU STATION', x + 115, base - 128);
  }

  // --- 4: 東京タワー(夕方) ---
  function drawTokyoTower(x) {
    const base = 470, top = 110, cx = x + 60;

      ctx.lineTo(cx + s * 4, top + 40); ctx.stroke();
    };
    // 紅白のしま(下から)
    const bands = 7;
    for (let i = 0; i < bands; i++) {
      const y1 = base - (base - top - 40) * i / bands, y2 = base - (base - top - 40) * (i + 1) / bands;
      const w1 = widthAt(y1), w2 = widthAt(y2);
      ctx.fillStyle = i % 2 ? '#f6f1ea' : '#e1573a';
      ctx.beginPath(); ctx.moveTo(cx - w1, y1); ctx.lineTo(cx - w2, y2); ctx.lineTo(cx + w2, y2); ctx.lineTo(cx + w1, y1); ctx.closePath(); ctx.fill();
    }
    function widthAt(y) { const t = (base - y) / (base - top - 40); return 60 * Math.pow(1 - t, 2.2) + 4; }
    // 鉄骨の線
    line(2); leg(-1); leg(1);
    ctx.strokeStyle = 'rgba(46,46,46,0.35)'; ctx.lineWidth = 1;
    for (let y = base - 12; y > top + 50; y -= 16) {
      const w = widthAt(y), w2 = widthAt(y - 16);
      ctx.beginPath(); ctx.moveTo(cx - w, y); ctx.lineTo(cx + w2, y - 16); ctx.moveTo(cx + w, y); ctx.lineTo(cx - w2, y - 16); ctx.stroke();
    }
    // 展望台
    line(2); ctx.fillStyle = '#f6f1ea';
    rr(cx - 26, base - 150, 52, 16, 3); ctx.fill(); ctx.stroke();
    rr(cx - 10, base - 260, 20, 10, 3); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = '#e1573a'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(cx, top + 40); ctx.lineTo(cx, top); ctx.stroke();
    nameBoard('東京タワー', 'TOKYO TOWER', cx + 95, base - 200, '#b5442f');
  }

  function stageSpace(lm) {
    drawSky('#05061a', '#2a2357', 560);
    for (const s of STARS) {
      const tw = 0.5 + Math.sin(S.t * 0.05 + s.p) * 0.5;
      ctx.fillStyle = `rgba(255,255,255,${0.4 + tw * 0.6})`;
      ctx.beginPath(); ctx.arc(wrapX(s.x - S.scroll * 0.02, W), s.y, s.r, 0, 7); ctx.fill();
    }
    // 地球
    const ex = 290, ey = 170;
    ctx.fillStyle = '#4f8fd6'; ctx.beginPath(); ctx.arc(ex, ey, 56, 0, 7); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(ex, ey, 56, 0, 7); ctx.clip();
    ctx.fillStyle = '#7cbf6a';
    ctx.beginPath(); ctx.ellipse(ex - 18, ey - 10, 22, 14, 0.5, 0, 7); ctx.ellipse(ex + 20, ey + 18, 18, 10, -0.4, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(ex + 4, ey - 34, 30, 6, 0.1, 0, 7); ctx.ellipse(ex - 10, ey + 30, 24, 5, -0.2, 0, 7); ctx.fill();
    ctx.restore();
    // 流れ星
    const sp = S.t % 240;
    if (sp < 30) {
      ctx.strokeStyle = `rgba(255,255,255,${1 - sp / 30})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(60 + sp * 6, 60 + sp * 3); ctx.lineTo(30 + sp * 6, 45 + sp * 3); ctx.stroke();
    }
    if (lm) drawSatellite(lm.x);

    ctx.fillStyle = '#8d8c99';
    const off = wrapX(-S.scroll * 0.15, 500);
    for (let k = -1; k < 2; k++) {

      ctx.beginPath(); ctx.moveTo(bx, 520); ctx.quadraticCurveTo(bx + 120, 470, bx + 250, 515); ctx.quadraticCurveTo(bx + 380, 480, bx + 500, 520); ctx.lineTo(bx + 500, GROUND); ctx.lineTo(bx, GROUND); ctx.fill();
    }
    // 月面(クレーター)
    ctx.fillStyle = '#bdbcc6'; ctx.fillRect(0, GROUND, W, H - GROUND);
    line(2.5); ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
    const co = wrapX(-S.scroll, 260);
    ctx.fillStyle = '#a5a4b0';
    for (let x = co - 260; x < W + 260; x += 260) {
      ctx.beginPath(); ctx.ellipse(x + 40, GROUND + 40, 34, 9, 0, 0, 7); ctx.ellipse(x + 170, GROUND + 95, 22, 6, 0, 0, 7); ctx.ellipse(x + 210, GROUND + 30, 12, 4, 0, 0, 7); ctx.fill();
    }
  }

    });
    ctx.fillStyle = COL.light; rr(50, 360, W - 100, 124, 12); ctx.fill();
    text('庵治石まめちしき', W / 2, 380, 13, '#6f675c');
    wrapText(S.trivia, W / 2, 410, W - 130, 22, 14);
    if (S.overT > 40) {
      button('もう一回！', 40, 540, W - 80, 58, startGame, 'main');
      button('ホームへ', 40, 612, (W - 92) / 2, 48, () => go('home'));
      button('ランキング', 52 + (W - 92) / 2, 612, (W - 92) / 2, 48, () => go('ranking'));
    }
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawBG();
    for (const it of S.items) drawItem(it);
    for (const sp of S.specials) drawSpecial(sp);
    for (const o of S.obstacles) drawObstacle(o);
    if (inMenu()) {
      const f = Math.floor(S.t / 120) % 4 === 3 ? 'tehe' : 'happy';
      drawWaraishi(W / 2, GROUND, f, P.run, 0, false);
    } else {
      drawWaraishi(P.x, P.y, P.face, P.run, P.squash, !P.onGround && S.mode === 'play');
    }
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    S.buttons = [];
    if (S.mode === 'play') drawHUD();
    if (S.mode === 'home') drawHome();
    if (S.mode === 'start') drawStart();
    if (S.mode === 'ranking') drawRanking();
    if (S.mode === 'items') drawItems();
    if (S.mode === 'credits') drawCredits();
    if (S.mode === 'over') drawOver();
  }

  // ===== メインループ(60fps固定ステップ) =====
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 動作確認用(URLに ?debug を付けたときだけ)
  if (location.search.includes('debug')) window.__G = { S, P, spawnSpecial, spawnGrave, Music };
})();
</script>
