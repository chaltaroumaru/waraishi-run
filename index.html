<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9d3cb">
<title>わらいしくんラン ～春日川を走れ！～</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #d9d3cb; overflow: hidden; touch-action: manipulation; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  canvas { display: block; }
  #mute {
    position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
    border: 2px solid #2e2e2e; border-radius: 50%; background: #f4f1ec;
    font-size: 18px; cursor: pointer; z-index: 2;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="音のオン・オフ">🔊</button>
</div>
<script>
(() => {
  // ===== 基本設定 =====
  const W = 400, H = 700;            // 論理解像度(縦長スマホ向け)
  const GROUND = 560;                // 走る道のY座標
  const RIVER_TOP = 452, RIVER_BOTTOM = 506; // 春日川の水面
  const COL = { light: '#d9d3cb', mid: '#b3aa9c', dark: '#2e2e2e', pink: '#ebcaca', paper: '#f4f1ec', side: '#a59c8e' };
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let scale = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== わらいしくんの絵(キャラクター資料から切り出したもの) =====
  const IMG = {};
  ['head_main', 'head_happy', 'head_surprise', 'head_tehe', 'head_sad', 'torso'].forEach(n => {
    const im = new Image(); im.src = `assets/sprites/${n}.png`; IMG[n] = im;
  });
  const FACE_IMG = { normal: 'head_main', happy: 'head_happy', surprise: 'head_surprise', tehe: 'head_tehe', sad: 'head_sad' };
  const ready = im => im && im.complete && im.naturalWidth > 0;

  // ===== サウンド =====
  let audio = null, muted = localStorage.getItem('waraishi_mute') === '1';
  const muteBtn = document.getElementById('mute');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.addEventListener('pointerdown', e => {
    e.stopPropagation();
    muted = !muted;
    localStorage.setItem('waraishi_mute', muted ? '1' : '0');
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (_) {}
  }

  // ===== 庵治石まめちしき(ゲームオーバー時に1つ表示) =====
  const TRIVIA = [
    '庵治石(あじいし)は香川県高松市の庵治町・牟礼町でとれる花崗岩だよ。',
    '庵治石は「花崗岩のダイヤモンド」とも呼ばれているんだ。',
    'みがくと浮かび上がる、まだらなかすり模様を「斑(ふ)」と呼ぶよ。',
    '庵治石はきめが細かくてかたいから、細かい彫刻もくっきり長持ち！',
    '雨や風に強く、長い年月がたっても風合いが変わりにくいのが自慢。',
    '庵治石の産地は、五剣山(ごけんざん)のふもとに広がっているよ。',
    '灯籠(とうろう)や彫刻、インテリアにも庵治石が使われているんだ。',
    '庵治・牟礼には、石を切り出し・加工する職人さんがたくさんいるよ。',
  ];

  // ===== 香川の特産品(たまに出てくるボーナスアイテム) =====
  const SPECIALS = [
    { id: 'udon',   name: '讃岐うどん', text: '香川といえば うどん！「うどん県」と名乗るほど！' },
    { id: 'glove',  name: '手袋',       text: '東かがわ市は、日本一の手袋の産地なんだ！' },
    { id: 'olive',  name: 'オリーブ',   text: '小豆島は、日本のオリーブ栽培発祥の地！' },
    { id: 'chicken',name: '骨付鳥',     text: '丸亀生まれ！スパイスのきいた鶏もも焼き' },
    { id: 'uchiwa', name: '丸亀うちわ', text: '丸亀は、うちわの生産量が全国トップクラス！' },
  ];
  const SPECIAL_BONUS = 100;

  // ===== ゲーム状態 =====
  const S = {
    mode: 'title',       // title | play | over
    t: 0, speed: 0, dist: 0, score: 0, stones: 0, bonus: 0, got: [],
    best: Number(localStorage.getItem('waraishi_best') || 0),
    obstacles: [], items: [], specials: [], particles: [], clouds: [],
    spawnT: 0, itemT: 0, specialT: 0, trivia: '', overT: 0, newBest: false, shake: 0,
    banner: null,          // 特産品をとったときの表示
    landmark: null,        // 高松大学など、たまに出てくる景色
    landmarkT: 0, signX: 120, scroll: 0,
  };
  const P = { x: 90, y: GROUND, vy: 0, jumps: 0, onGround: true, face: 'normal', faceT: 0, run: 0, squash: 0 };

  for (let i = 0; i < 4; i++) S.clouds.push({ x: Math.random() * W, y: 50 + Math.random() * 170, s: 0.6 + Math.random() * 0.6 });

  function reset() {
    Object.assign(S, {
      mode: 'play', t: 0, speed: 5.2, dist: 0, score: 0, stones: 0, bonus: 0, got: [],
      obstacles: [], items: [], specials: [], particles: [], spawnT: 60, itemT: 90,
      specialT: 420 + Math.random() * 240, newBest: false, banner: null,
      landmark: null, landmarkT: 900, signX: 260,
    });
    Object.assign(P, { y: GROUND, vy: 0, jumps: 0, onGround: true, face: 'normal', faceT: 0 });
  }

  // ===== 入力 =====
  function press() {
    if (S.mode === 'title') { reset(); beep(660, 0.12); return; }
    if (S.mode === 'over') { if (S.overT > 40) { reset(); beep(660, 0.12); } return; }
    if (P.jumps < 2) {
      P.vy = P.jumps === 0 ? -15.5 : -13;
      P.jumps++; P.onGround = false;
      setFace('surprise', 18);
      beep(P.jumps === 1 ? 420 : 560, 0.15, 'square', 0.06, 300);
      for (let i = 0; i < 6; i++) dust(P.x, P.y);
    }
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
  });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  function setFace(f, t) { P.face = f; P.faceT = t; }
  function dust(x, y) {
    S.particles.push({ x: x + (Math.random() - 0.5) * 30, y, vx: -1 - Math.random() * 2, vy: -Math.random() * 2, life: 25, r: 3 + Math.random() * 4, c: COL.mid });
  }
  function sparkle(x, y, n = 10) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 3;
      S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30, r: 2 + Math.random() * 3, c: i % 2 ? '#f2c94c' : COL.paper });
    }
  }

  // ===== 障害物・アイテムの出現 =====
  function spawnObstacle() {
    const lvl = Math.min(1, S.dist / 6000);
    const r = Math.random();
    let o;
    if (r < 0.35) o = { type: 'rocks', w: 46, h: 34 };
    else if (r < 0.65) o = { type: 'lantern', w: 40, h: 78 };
    else if (r < 0.85 && S.dist > 800) o = { type: 'crow', w: 44, h: 26, fy: GROUND - 130 - Math.random() * 40, flap: 0 };
    else o = { type: 'rocks', w: 70, h: 40 };
    o.x = W + 20;
    S.obstacles.push(o);
    S.spawnT = (95 - lvl * 35) + Math.random() * 55;
    if (lvl > 0.3 && Math.random() < 0.25 && o.type === 'rocks') {
      S.obstacles.push({ type: 'rocks', w: 46, h: 34, x: o.x + o.w + 150 + S.speed * 6 });
      S.spawnT += 40;
    }
  }
  function spawnItem() {
    const high = Math.random() < 0.5;
    S.items.push({ x: W + 20, y: high ? GROUND - 180 : GROUND - 80, r: 13, t: 0 });
    S.itemT = 70 + Math.random() * 90;
  }
  function spawnSpecial() {
    // まだとっていない特産品を優先して出す
    const left = SPECIALS.filter(s => !S.got.includes(s.id));
    const pool = left.length ? left : SPECIALS;
    const sp = pool[Math.floor(Math.random() * pool.length)];
    S.specials.push({ ...sp, x: W + 30, y: GROUND - 150 - Math.random() * 50, t: 0 });
    S.specialT = 480 + Math.random() * 300; // 約8〜13秒に1回
  }

  function hitbox(o) {
    if (o.type === 'crow') return { x: o.x + 6, y: o.fy - o.h / 2 + 4, w: o.w - 12, h: o.h - 8 };
    if (o.type === 'lantern') return { x: o.x + 8, y: GROUND - o.h + 6, w: o.w - 16, h: o.h - 6 };
    return { x: o.x + 5, y: GROUND - o.h + 8, w: o.w - 10, h: o.h - 8 };
  }
  // 頭+胴をざっくり。少し小さめにして理不尽な当たりを防ぐ
  const playerBox = () => ({ x: P.x - 26, y: P.y - 104, w: 52, h: 98 });
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  const near = (pb, x, y, r) => x > pb.x - r && x < pb.x + pb.w + r && y > pb.y - r && y < pb.y + pb.h + r;

  // ===== 更新 =====
  function update() {
    S.t++;
    const spd = S.mode === 'play' ? S.speed : (S.mode === 'title' ? 2.5 : 0);
    S.scroll += spd;
    S.clouds.forEach(c => { c.x -= spd * 0.08 * c.s; if (c.x < -100) { c.x = W + 60; c.y = 50 + Math.random() * 170; } });
    S.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
    S.particles = S.particles.filter(p => p.life > 0);
    if (S.shake > 0) S.shake--;
    if (S.banner && --S.banner.t <= 0) S.banner = null;

    // 景色: 春日川の看板と高松大学
    S.signX -= spd * 0.3;  // 看板と校舎は同じ向こう岸なので同じ速さで流す
    if (S.signX < -140) S.signX = W + 900 + Math.random() * 600;
    if (S.landmark) { S.landmark.x -= spd * 0.3; if (S.landmark.x < -260) S.landmark = null; }
    else if (S.mode !== 'over' && --S.landmarkT <= 0) {
      S.landmark = { type: 'univ', x: W + 20 };
      // 看板と重ならないように離す
      if (S.signX > -140 && S.signX < W + 260) S.signX = Math.max(S.signX, W + 300);
      S.landmarkT = 1300 + Math.random() * 700;
    }

    if (S.mode === 'title') { P.run += 0.25; return; }
    if (S.mode === 'over') { S.overT++; return; }

    S.speed = Math.min(12, 5.2 + S.dist / 1400);
    S.dist += S.speed;
    S.score = Math.floor(S.dist / 10) + S.stones * 50 + S.bonus;

    // プレイヤー
    P.vy += 0.8;
    P.y += P.vy;
    if (P.y >= GROUND) {
      if (!P.onGround) { P.squash = 8; for (let i = 0; i < 5; i++) dust(P.x, GROUND); }
      P.y = GROUND; P.vy = 0; P.onGround = true; P.jumps = 0;
    }
    if (P.squash > 0) P.squash--;
    P.run += S.speed * 0.05;
    if (P.faceT > 0 && --P.faceT === 0) P.face = 'normal';
    if (P.onGround && S.t % 8 === 0) dust(P.x - 15, GROUND);

    if (--S.spawnT <= 0) spawnObstacle();
    if (--S.itemT <= 0) spawnItem();
    if (--S.specialT <= 0) spawnSpecial();

    const pb = playerBox();
    for (const o of S.obstacles) {
      o.x -= S.speed * (o.type === 'crow' ? 1.25 : 1);
      if (o.type === 'crow') o.flap += 0.3;
      if (overlap(pb, hitbox(o))) return gameOver();
    }
    S.obstacles = S.obstacles.filter(o => o.x > -100);

    // 庵治石のかけら
    for (const it of S.items) {
      it.x -= S.speed; it.t++;
      const cy = it.y + Math.sin(it.t * 0.1) * 5;
      if (!it.got && near(pb, it.x, cy, it.r)) {
        it.got = true; S.stones++; setFace('tehe', 30); sparkle(it.x, cy);
        beep(880, 0.08, 'triangle', 0.08); setTimeout(() => beep(1320, 0.12, 'triangle', 0.08), 70);
      }
    }
    S.items = S.items.filter(it => it.x > -40 && !it.got);

    // 香川の特産品
    for (const sp of S.specials) {
      sp.x -= S.speed; sp.t++;
      const cy = sp.y + Math.sin(sp.t * 0.08) * 6;
      if (!sp.got && near(pb, sp.x, cy, 20)) {
        sp.got = true; S.bonus += SPECIAL_BONUS;
        if (!S.got.includes(sp.id)) S.got.push(sp.id);
        setFace('happy', 60); sparkle(sp.x, cy, 18);
        S.banner = { name: sp.name, text: sp.text, id: sp.id, t: 150 };
        [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle', 0.08), i * 70));
      }
    }
    S.specials = S.specials.filter(sp => sp.x > -50 && !sp.got);
  }

  function gameOver() {
    S.mode = 'over'; S.overT = 0; S.shake = 14; S.banner = null;
    setFace('sad', 0);
    S.trivia = TRIVIA[Math.floor(Math.random() * TRIVIA.length)];
    if (S.score > S.best) { S.best = S.score; S.newBest = true; localStorage.setItem('waraishi_best', S.best); }
    beep(300, 0.2, 'sawtooth', 0.07, -150); setTimeout(() => beep(180, 0.35, 'sawtooth', 0.07, -80), 180);
  }

  // ===== 描画ヘルパー =====
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function line(w = 2.5, c = COL.dark) { ctx.lineWidth = w; ctx.strokeStyle = c; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
  const FONT = '"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif';
  function text(str, x, y, size, color = COL.dark, align = 'center', weight = 'bold') {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function speckle(x, y, w, h, n, seed) {
    ctx.fillStyle = 'rgba(46,46,46,0.12)';
    let s = seed;
    for (let i = 0; i < n; i++) {
      s = (s * 9301 + 49297) % 233280; const rx = s / 233280;
      s = (s * 9301 + 49297) % 233280; const ry = s / 233280;
      ctx.fillRect(x + rx * w, y + ry * h, 1.6, 1.6);
    }
  }
  const wrapX = (x, span) => ((x % span) + span) % span;

  // ===== わらいしくん =====
  // 資料どおり: 大きな四角い頭 / ゴツゴツした石の胴 / 細い腕とミトンの手 / 細い足と四角い靴
  function drawWaraishi(px, py, face, run, squash, inAir) {
    ctx.save();
    ctx.translate(px, py);
    const sq = squash > 0 ? squash / 8 : 0;
    const step = Math.sin(run);
    const bounce = !inAir ? Math.abs(Math.cos(run)) * 3 : 0;

    // 影
    const hgt = Math.max(0, GROUND - py);
    ctx.fillStyle = `rgba(46,46,46,${0.16 * Math.max(0.3, 1 - hgt / 250)})`;
    ctx.beginPath(); ctx.ellipse(0, GROUND - py + 2, 32 - Math.min(14, hgt / 15), 6, 0, 0, Math.PI * 2); ctx.fill();

    ctx.scale(1 + sq * 0.1, 1 - sq * 0.1);
    const by = -bounce;

    // 足(細い棒 + 小さな四角い靴)
    line(2.2);
    const legs = inAir ? [[-8, -7, -6], [8, 9, -12]] : [[-8, step * 7, 0], [8, -step * 7, 0]];
    for (const [lx, sw, lift] of legs) {
      const fx = lx + sw, fy = -5 + (inAir ? lift : Math.min(0, -Math.abs(sw) * 0.5));
      ctx.beginPath(); ctx.moveTo(lx * 0.8, -22 + by); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = COL.light; rr(fx - 6, fy - 2, 12, 8, 2.5); ctx.fill(); ctx.stroke();
    }

    // 腕(細い棒 + ミトン)
    const armSw = inAir ? 0 : step * 5;
    for (const side of [-1, 1]) {
      const sx = side * 17, sy = -36 + by;
      const hx = side * 33, hy = (inAir ? -52 : -30) + by + side * armSw;
      line(2.2); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = COL.light;
      ctx.beginPath(); ctx.arc(hx, hy, 5.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + side * 3, hy - 5, 2.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // 胴体(資料の絵)
    if (ready(IMG.torso)) ctx.drawImage(IMG.torso, -27, -46 + by, 54, 26);
    else { ctx.fillStyle = COL.mid; rr(-22, -46 + by, 44, 24, 6); ctx.fill(); }

    // 頭(資料の絵。表情ごとに差し替え)
    const im = IMG[FACE_IMG[face] || 'head_main'];
    ctx.save();
    ctx.translate(0, -36 + by);
    ctx.rotate(inAir ? -0.06 : step * 0.02);
    const hw = 76;
    if (ready(im)) {
      const hh = hw * im.naturalHeight / im.naturalWidth;
      ctx.drawImage(im, -hw / 2, -hh, hw, hh);
    } else {
      ctx.fillStyle = COL.light; rr(-hw / 2, -74, hw, 74, 4); ctx.fill(); line(2.5); ctx.stroke();
    }
    ctx.restore();
    ctx.restore();
  }

  // ===== 障害物 =====
  function drawObstacle(o) {
    line(2.5);
    if (o.type === 'lantern') {
      const x = o.x, b = GROUND, w = o.w;
      ctx.fillStyle = COL.mid;
      rr(x + 4, b - 12, w - 8, 12, 2); ctx.fill(); ctx.stroke();
      rr(x + 13, b - 42, w - 26, 30, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = COL.light;
      rr(x + 6, b - 60, w - 12, 18, 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f7e3a1'; ctx.fillRect(x + 15, b - 56, w - 30, 10); ctx.strokeRect(x + 15, b - 56, w - 30, 10);
      ctx.fillStyle = COL.mid;
      ctx.beginPath(); ctx.moveTo(x - 2, b - 60); ctx.lineTo(x + w / 2, b - 74); ctx.lineTo(x + w + 2, b - 60); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + w / 2, b - 76, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      speckle(x + 4, b - 60, w - 8, 60, 25, 11);
    } else if (o.type === 'rocks') {
      const x = o.x, b = GROUND, w = o.w, h = o.h;
      ctx.fillStyle = COL.mid;
      ctx.beginPath();
      ctx.moveTo(x, b); ctx.lineTo(x + w * 0.08, b - h * 0.55); ctx.lineTo(x + w * 0.3, b - h * 0.8);
      ctx.lineTo(x + w * 0.45, b - h); ctx.lineTo(x + w * 0.7, b - h * 0.85); ctx.lineTo(x + w * 0.92, b - h * 0.5); ctx.lineTo(x + w, b);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w * 0.45, b - h); ctx.lineTo(x + w * 0.5, b - h * 0.4); ctx.lineTo(x + w * 0.3, b); ctx.stroke();
      speckle(x, b - h, w, h, 20, 5);
    } else if (o.type === 'crow') {
      const x = o.x, y = o.fy, f = Math.sin(o.flap) * 10;
      ctx.fillStyle = COL.dark;
      ctx.beginPath(); ctx.ellipse(x + 22, y, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 8, y - 4, 7, 0, Math.PI * 2); ctx.fill();

  // ===== 背景: 春日川ぞいの道 =====
  function drawMountains() {
    // 遠景: 屋島(テーブル状の山)と五剣山(ギザギザの山)
    const span = 760, off = wrapX(-S.scroll * 0.06, span);
    for (let k = -1; k < 2; k++) {
      const bx = off + k * span;
      ctx.fillStyle = '#cdd3cf';
      // 屋島
      ctx.beginPath(); ctx.moveTo(bx - 20, 440); ctx.quadraticCurveTo(bx + 30, 360, bx + 70, 352);
      ctx.lineTo(bx + 230, 348); ctx.quadraticCurveTo(bx + 270, 356, bx + 330, 440); ctx.closePath(); ctx.fill();
      // 五剣山
      ctx.fillStyle = '#c3c9c4';
      ctx.beginPath(); ctx.moveTo(bx + 380, 440);
      const peaks = [[420, 380], [440, 395], [458, 360], [476, 388], [494, 352], [512, 384], [530, 364], [548, 392], [566, 374]];
      ctx.lineTo(bx + 400, 400);
      peaks.forEach(([a, b]) => ctx.lineTo(bx + a, b));
      ctx.lineTo(bx + 640, 440); ctx.closePath(); ctx.fill();
    }
  }
  function drawFarBank() {
    // 向こう岸: 桜並木と家並み
    const span = 520, off = wrapX(-S.scroll * 0.3, span);
    ctx.fillStyle = '#c4cba7'; ctx.fillRect(0, 432, W, RIVER_TOP - 432);
    for (let k = -1; k < 2; k++) {
      const bx = off + k * span;
      // 家
      [[20, 26, '#e8e2d6'], [120, 20, '#ddd5c6'], [300, 30, '#e8e2d6'], [420, 22, '#d9d0c0']].forEach(([hx, hh, c]) => {
        ctx.fillStyle = c; ctx.fillRect(bx + hx, 432 - hh, 38, hh);
        ctx.fillStyle = '#8f8a80'; ctx.beginPath(); ctx.moveTo(bx + hx - 4, 432 - hh); ctx.lineTo(bx + hx + 19, 432 - hh - 12); ctx.lineTo(bx + hx + 42, 432 - hh); ctx.fill();
      });
      // 桜の木
      [70, 200, 250, 370, 480].forEach((tx, i) => {
        ctx.fillStyle = '#7c6a58'; ctx.fillRect(bx + tx - 2, 418, 4, 16);
        ctx.fillStyle = i % 2 ? '#f2cfd3' : COL.pink;
        ctx.beginPath(); ctx.arc(bx + tx, 410, 14, 0, 7); ctx.arc(bx + tx - 11, 416, 10, 0, 7); ctx.arc(bx + tx + 11, 416, 10, 0, 7); ctx.fill();
      });

  }
  function drawUniversity(x) {
    // 高松大学(向こう岸に見える校舎)
    const base = 432;
    ctx.fillStyle = '#efe9dd'; line(2);

    ctx.fillStyle = '#e4dccd'; ctx.fillRect(x + 70, base - 96, 60, 26); ctx.strokeRect(x + 70, base - 96, 60, 26);
    // 時計
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 100, base - 83, 8, 0, 7); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 100, base - 83); ctx.lineTo(x + 100, base - 88); ctx.moveTo(x + 100, base - 83); ctx.lineTo(x + 104, base - 83); ctx.stroke();
    // 窓
    ctx.fillStyle = '#a9c6d1';
    for (let r = 0; r < 2; r++) for (let c = 0; c < 8; c++) {
      if (c === 3 || c === 4) continue;
      ctx.fillRect(x + 12 + c * 23, base - 60 + r * 22, 14, 12);
    }
    ctx.fillStyle = '#8c7b66'; ctx.fillRect(x + 88, base - 22, 24, 22);

    ctx.fillStyle = '#2e5a8a'; rr(x + 42, base - 128, 116, 26, 6); ctx.fill();

  function drawRiver() {
    // 春日川の水面
    const g = ctx.createLinearGradient(0, RIVER_TOP, 0, RIVER_BOTTOM);
    g.addColorStop(0, '#9fbfcb'); g.addColorStop(1, '#b9d2da');
    ctx.fillStyle = g; ctx.fillRect(0, RIVER_TOP, W, RIVER_BOTTOM - RIVER_TOP);
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    // 波(川の流れ + 走るスクロール)
    const off = wrapX(-S.scroll * 0.5 - S.t * 0.4, 90);
    for (let row = 0; row < 3; row++) {
      const y = RIVER_TOP + 12 + row * 16;
      for (let x = off - 90 + row * 30; x < W + 90; x += 90) {
        ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 8, y - 3, x + 16, y); ctx.quadraticCurveTo(x + 24, y + 3, x + 32, y); ctx.stroke();

  function drawPath() {

  function drawBG() {
    const g = ctx.createLinearGradient(0, 0, 0, 440);

    for (const c of S.clouds) {
      ctx.beginPath(); ctx.ellipse(c.x, c.y, 34 * c.s, 13 * c.s, 0, 0, Math.PI * 2);

    drawMountains();

    if (S.landmark) drawUniversity(S.landmark.x);

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawBG();
    for (const it of S.items) drawItem(it);
    for (const sp of S.specials) drawSpecial(sp);
    for (const o of S.obstacles) drawObstacle(o);
    if (S.mode === 'title') {
      const f = Math.floor(S.t / 120) % 4 === 3 ? 'tehe' : 'happy';
      drawWaraishi(W / 2, GROUND, f, P.run, 0, false);
    } else {
      drawWaraishi(P.x, P.y, P.face, P.run, P.squash, !P.onGround && S.mode === 'play');
    }
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (S.mode === 'play') drawHUD();
    if (S.mode === 'title') drawTitle();
    if (S.mode === 'over') drawOver();
  }

  // ===== メインループ(60fps固定ステップ) =====
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // 動作確認用(URLに ?debug を付けたときだけ)
  if (location.search.includes('debug')) window.__G = { S, P, spawnSpecial };
})();
</script>
