<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d9d3cb">
<title>わらいしくんラン ～庵治石のまちを走れ！～</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #d9d3cb; overflow: hidden; touch-action: manipulation; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: relative; }
  canvas { display: block; border-radius: 0; }
  #mute {
    position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
    border: 2px solid #2e2e2e; border-radius: 50%; background: #f4f1ec;
    font-size: 18px; cursor: pointer; z-index: 2;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <button id="mute" aria-label="音のオン・オフ">🔊</button>
</div>
<script>
(() => {
  // ===== 基本設定 =====
  const W = 400, H = 700;            // 論理解像度(縦長スマホ向け)
  const GROUND = 560;                // 地面のY座標
  const COL = { light: '#d9d3cb', mid: '#b3aa9c', dark: '#2e2e2e', pink: '#ebcaca', paper: '#f4f1ec', side: '#a59c8e' };
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let scale = 1;

  function resize() {
    const vw = window.innerWidth, vh = window.innerHeight;
    scale = Math.min(vw / W, vh / H);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = W * scale + 'px';
    canvas.style.height = H * scale + 'px';
    canvas.width = Math.round(W * scale * dpr);
    canvas.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ===== サウンド(WebAudio の簡単な効果音) =====
  let audio = null, muted = localStorage.getItem('waraishi_mute') === '1';
  const muteBtn = document.getElementById('mute');
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.addEventListener('pointerdown', e => {
    e.stopPropagation();
    muted = !muted;
    localStorage.setItem('waraishi_mute', muted ? '1' : '0');
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });
  function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
    if (muted) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g).connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (_) {}
  }

  // ===== 庵治石まめちしき(ゲームオーバー時に1つ表示) =====
  const TRIVIA = [
    '庵治石(あじいし)は香川県高松市の庵治町・牟礼町でとれる花崗岩だよ。',
    '庵治石は「花崗岩のダイヤモンド」とも呼ばれているんだ。',
    'みがくと浮かび上がる、まだらなかすり模様を「斑(ふ)」と呼ぶよ。',
    '庵治石はきめが細かくてかたいから、細かい彫刻もくっきり長持ち！',
    '雨や風に強く、長い年月がたっても風合いが変わりにくいのが自慢。',
    '庵治石の産地は、五剣山(ごけんざん)のふもとに広がっているよ。',
    '灯籠(とうろう)や彫刻、インテリアにも庵治石が使われているんだ。',
    '庵治・牟礼には、石を切り出し・加工する職人さんがたくさんいるよ。',
  ];

  // ===== ゲーム状態 =====
  const best0 = Number(localStorage.getItem('waraishi_best') || 0);
  const S = {
    mode: 'title',       // title | play | over
    t: 0, speed: 0, dist: 0, score: 0, stones: 0, best: best0,
    obstacles: [], items: [], particles: [], clouds: [], hills: [],
    spawnT: 0, itemT: 0, trivia: '', overT: 0, newBest: false, shake: 0,
  };
  const P = { x: 90, y: GROUND, vy: 0, jumps: 0, onGround: true, face: 'happy', faceT: 0, run: 0, squash: 0 };
  const PW = 58, PH = 60;  // 頭(石)のサイズ

  for (let i = 0; i < 4; i++) S.clouds.push({ x: Math.random() * W, y: 60 + Math.random() * 180, s: 0.6 + Math.random() * 0.6 });
  for (let i = 0; i < 3; i++) S.hills.push({ x: i * 220, w: 260 + Math.random() * 80, h: 70 + Math.random() * 60 });

  function reset() {
    S.mode = 'play'; S.t = 0; S.speed = 5.2; S.dist = 0; S.score = 0; S.stones = 0;
    S.obstacles = []; S.items = []; S.particles = []; S.spawnT = 60; S.itemT = 90; S.newBest = false;
    P.y = GROUND; P.vy = 0; P.jumps = 0; P.onGround = true; P.face = 'happy'; P.faceT = 0;
  }

  // ===== 入力 =====
  function press() {
    if (S.mode === 'title') { reset(); beep(660, 0.12); return; }
    if (S.mode === 'over') { if (S.overT > 40) { reset(); beep(660, 0.12); } return; }
    if (P.jumps < 2) {
      P.vy = P.jumps === 0 ? -15.5 : -13;
      P.jumps++; P.onGround = false;
      setFace('surprise', 18);
      beep(P.jumps === 1 ? 420 : 560, 0.15, 'square', 0.06, 300);
      for (let i = 0; i < 6; i++) dust(P.x, P.y);
    }
  }
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
  });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  function setFace(f, t) { P.face = f; P.faceT = t; }
  function dust(x, y) {
    S.particles.push({ x: x + (Math.random() - 0.5) * 30, y, vx: -1 - Math.random() * 2, vy: -Math.random() * 2, life: 25, r: 3 + Math.random() * 4, c: COL.mid });
  }
  function sparkle(x, y) {
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 3;
      S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30, r: 2 + Math.random() * 3, c: i % 2 ? '#f2c94c' : COL.paper });
    }
  }

  // ===== 障害物 =====
  // lantern: 石灯籠 / rocks: 石ころの山 / crow: 空を飛ぶカラス / chisel: 職人のノミ(高い)
  function spawnObstacle() {
    const lvl = Math.min(1, S.dist / 6000);
    const r = Math.random();
    let o;
    if (r < 0.35) o = { type: 'rocks', w: 46, h: 34 };
    else if (r < 0.65) o = { type: 'lantern', w: 40, h: 78 };
    else if (r < 0.85 && S.dist > 800) o = { type: 'crow', w: 44, h: 26, fy: GROUND - 120 - Math.random() * 40, flap: 0 };
    else o = { type: 'rocks', w: 70, h: 40 };
    o.x = W + 20;
    S.obstacles.push(o);
    // 次の出現までの間隔(速くなるほど詰まる)
    const base = 95 - lvl * 35;
    S.spawnT = base + Math.random() * 55;
    // たまに連続配置
    if (lvl > 0.3 && Math.random() < 0.25 && o.type === 'rocks') {
      S.obstacles.push({ type: 'rocks', w: 46, h: 34, x: o.x + o.w + 150 + S.speed * 6 });
      S.spawnT += 40;
    }
  }
  function spawnItem() {
    const high = Math.random() < 0.5;
    S.items.push({ x: W + 20, y: high ? GROUND - 170 : GROUND - 70, r: 13, t: 0 });
    S.itemT = 70 + Math.random() * 90;
  }

  function hitbox(o) {
    if (o.type === 'crow') return { x: o.x + 6, y: o.fy - o.h / 2 + 4, w: o.w - 12, h: o.h - 8 };
    if (o.type === 'lantern') return { x: o.x + 8, y: GROUND - o.h + 6, w: o.w - 16, h: o.h - 6 };
    return { x: o.x + 5, y: GROUND - o.h + 8, w: o.w - 10, h: o.h - 8 };
  }
  function playerBox() {
    // 頭+胴をざっくり。少し小さめにして理不尽な当たりを防ぐ
    return { x: P.x - PW / 2 + 8, y: P.y - 100 + 8, w: PW - 16, h: 92 };
  }
  const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // ===== 更新 =====
  function update() {
    S.t++;
    // 背景はタイトル中もゆっくり流す
    const bgSpeed = S.mode === 'play' ? S.speed : (S.mode === 'title' ? 2 : 0);
    S.clouds.forEach(c => { c.x -= bgSpeed * 0.15 * c.s; if (c.x < -100) { c.x = W + 60; c.y = 60 + Math.random() * 180; } });
    S.hills.forEach(h => { h.x -= bgSpeed * 0.3; if (h.x + h.w < 0) { h.x = W + Math.random() * 60; h.h = 70 + Math.random() * 60; } });
    S.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; });
    S.particles = S.particles.filter(p => p.life > 0);
    if (S.shake > 0) S.shake--;

    if (S.mode === 'title') { P.run += 0.25; return; }
    if (S.mode === 'over') { S.overT++; return; }

    // スピードと距離
    S.speed = Math.min(12, 5.2 + S.dist / 1400);
    S.dist += S.speed;
    S.score = Math.floor(S.dist / 10) + S.stones * 50;

    // プレイヤー
    P.vy += 0.8;
    P.y += P.vy;
    if (P.y >= GROUND) {
      if (!P.onGround) { P.squash = 8; for (let i = 0; i < 5; i++) dust(P.x, GROUND); }
      P.y = GROUND; P.vy = 0; P.onGround = true; P.jumps = 0;
    }
    if (P.squash > 0) P.squash--;
    P.run += S.speed * 0.05;
    if (P.faceT > 0 && --P.faceT === 0) P.face = 'happy';
    if (P.onGround && S.t % 8 === 0) dust(P.x - 15, GROUND);

    // 生成
    if (--S.spawnT <= 0) spawnObstacle();
    if (--S.itemT <= 0) spawnItem();

    // 障害物
    const pb = playerBox();
    for (const o of S.obstacles) {
      o.x -= S.speed * (o.type === 'crow' ? 1.25 : 1);
      if (o.type === 'crow') o.flap += 0.3;
      if (overlap(pb, hitbox(o))) return gameOver();
    }
    S.obstacles = S.obstacles.filter(o => o.x > -100);

    // アイテム(庵治石のかけら)
    for (const it of S.items) {
      it.x -= S.speed; it.t++;
      const cx = it.x, cy = it.y + Math.sin(it.t * 0.1) * 5;
      if (!it.got && cx > pb.x - it.r && cx < pb.x + pb.w + it.r && cy > pb.y - it.r && cy < pb.y + pb.h + it.r) {
        it.got = true; S.stones++; setFace('tehe', 30); sparkle(cx, cy);
        beep(880, 0.08, 'triangle', 0.08); setTimeout(() => beep(1320, 0.12, 'triangle', 0.08), 70);
      }
    }
    S.items = S.items.filter(it => it.x > -40 && !it.got);
  }

  function gameOver() {
    S.mode = 'over'; S.overT = 0; S.shake = 14;
    setFace('sad', 0);
    S.trivia = TRIVIA[Math.floor(Math.random() * TRIVIA.length)];
    if (S.score > S.best) { S.best = S.score; S.newBest = true; localStorage.setItem('waraishi_best', S.best); }
    beep(300, 0.2, 'sawtooth', 0.07, -150); setTimeout(() => beep(180, 0.35, 'sawtooth', 0.07, -80), 180);
  }

  // ===== 描画ヘルパー =====
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function line(w = 2.5) { ctx.lineWidth = w; ctx.strokeStyle = COL.dark; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; }
  function text(str, x, y, size, color = COL.dark, align = 'center', weight = 'bold') {
    ctx.font = `${weight} ${size}px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif`;
    ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  // 石っぽいざらざら(固定シードの点々)
  function speckle(x, y, w, h, n, seed) {
    ctx.fillStyle = 'rgba(46,46,46,0.12)';
    let s = seed;
    for (let i = 0; i < n; i++) {
      s = (s * 9301 + 49297) % 233280; const rx = s / 233280;
      s = (s * 9301 + 49297) % 233280; const ry = s / 233280;
      ctx.fillRect(x + rx * w, y + ry * h, 1.6, 1.6);
    }
  }

  // ===== わらいしくん =====
  function drawWaraishi(px, py, face, run, squash, bob = true) {
    ctx.save();
    ctx.translate(px, py);
    const sq = squash > 0 ? squash / 8 : 0;
    ctx.scale(1 + sq * 0.12, 1 - sq * 0.12);
    const air = !P.onGround && S.mode === 'play';
    const step = Math.sin(run);
    const bounce = bob && !air ? Math.abs(Math.cos(run)) * 3 : 0;

    // 影
    if (S.mode !== 'over' || true) {
      ctx.save(); ctx.scale(1 / (1 + sq * 0.12), 1);
      const hgt = Math.max(0, GROUND - py);
      ctx.fillStyle = `rgba(46,46,46,${0.15 * Math.max(0.3, 1 - hgt / 250)})`;
      ctx.beginPath(); ctx.ellipse(0, GROUND - py + 2, 30 - Math.min(14, hgt / 15), 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 足(棒+ブロックの足)
    line(2.5);
    const legs = air ? [[-9, -6, -12, -4], [9, 6, 14, -8]] : [[-9, step * 8, 0, 0], [9, -step * 8, 0, 0]];
    for (const [lx, sw, , lift] of legs) {
      const fx = lx + sw, fy = -6 + (air ? lift : Math.min(0, -Math.abs(sw) * 0.4));
      ctx.beginPath(); ctx.moveTo(lx * 0.7, -26 - bounce); ctx.lineTo(fx, fy); ctx.stroke();
      ctx.fillStyle = COL.light; rr(fx - 7, fy - 2, 14, 9, 3); ctx.fill(); ctx.stroke();
    }

    // 胴体(ゴツゴツした石)
    const by = -bounce;
    ctx.fillStyle = COL.mid;
    ctx.beginPath();
    ctx.moveTo(-14, -52 + by); ctx.lineTo(13, -53 + by); ctx.lineTo(18, -40 + by); ctx.lineTo(23, -27 + by);
    ctx.lineTo(12, -22 + by); ctx.lineTo(4, -25 + by); ctx.lineTo(-6, -21 + by); ctx.lineTo(-22, -26 + by);
    ctx.lineTo(-18, -40 + by); ctx.closePath(); ctx.fill(); line(2.5); ctx.stroke();
    speckle(-18, -50 + by, 36, 26, 18, 7);

    // 腕(棒+ミトンの手)。走りに合わせてふる
    const armSw = air ? -10 : step * 6;
    for (const side of [-1, 1]) {
      const sx = side * 15, sy = -45 + by;
      const hx = side * 30, hy = (air ? -60 : -38) + by + (side === 1 ? armSw : -armSw) * 0.6;
      line(2.5); ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.fillStyle = COL.light; ctx.beginPath(); ctx.arc(hx, hy, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + side * 4, hy - 5, 2.8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }

    // 頭(庵治石のブロック)。少し傾ける
    ctx.save();
    ctx.translate(0, -52 + by);
    ctx.rotate(air ? -0.08 : step * 0.025);
    const hw = PW, hh = PH, d = 7; // d = 厚み
    const x0 = -hw / 2, y0 = -hh;
    // 上面と側面
    ctx.fillStyle = COL.side;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + d, y0 - d); ctx.lineTo(x0 + hw + d, y0 - d); ctx.lineTo(x0 + hw + d, y0 + hh - d);
    ctx.lineTo(x0 + hw, y0 + hh); ctx.lineTo(x0 + hw, y0); ctx.closePath(); ctx.fill(); line(2.5); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0 + hw, y0); ctx.lineTo(x0 + hw + d, y0 - d); ctx.stroke();
    // 正面
    ctx.fillStyle = COL.light; rr(x0, y0, hw, hh, 3); ctx.fill(); ctx.stroke();
    speckle(x0 + 3, y0 + 3, hw - 6, hh - 6, 40, 3);
    drawFace(x0, y0, hw, hh, face);
    ctx.restore();

    ctx.restore();
  }

  function drawFace(x0, y0, w, h, face) {
    const cx = x0 + w / 2;
    const u = w / 58; // 顔パーツの基準スケール
    line(1.8);
    // 特徴的な「山形の線」(てっぺんから左右へ広がる)
    ctx.beginPath();
    ctx.moveTo(x0 + 5, y0 + 30 * u);
    ctx.quadraticCurveTo(cx - 4, y0 + 24 * u, cx, y0 + 5 * u);
    ctx.quadraticCurveTo(cx + 4, y0 + 24 * u, x0 + w - 5, y0 + 30 * u);
    ctx.stroke();
    // 上の小さな点
    ctx.fillStyle = COL.dark;
    ctx.beginPath(); ctx.arc(cx - 6 * u, y0 + 22 * u, 1.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 8 * u, y0 + 25 * u, 1.3, 0, Math.PI * 2); ctx.fill();

    // 目
    const ey = y0 + 32 * u;
    if (face === 'sad') {
      ctx.beginPath(); ctx.moveTo(cx - 19 * u, ey - 1); ctx.quadraticCurveTo(cx - 13 * u, ey + 3, cx - 7 * u, ey - 1); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + 6 * u, ey - 2); ctx.quadraticCurveTo(cx + 12 * u, ey + 3, cx + 18 * u, ey); ctx.stroke();
    } else {
      // 左目(アーモンド形+黒目)
      ctx.beginPath(); ctx.moveTo(cx - 20 * u, ey); ctx.quadraticCurveTo(cx - 13 * u, ey - 5, cx - 6 * u, ey + 1);
      ctx.quadraticCurveTo(cx - 13 * u, ey + 4, cx - 20 * u, ey); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx - 14 * u, ey, face === 'surprise' ? 2.4 : 1.9, 0, Math.PI * 2); ctx.fill();
      // 右目(三日月+黒目)
      if (face === 'tehe') {
        ctx.beginPath(); ctx.moveTo(cx + 6 * u, ey); ctx.quadraticCurveTo(cx + 12 * u, ey - 5, cx + 18 * u, ey); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.arc(cx + 12 * u, ey - 1, 6 * u, Math.PI * 0.05, Math.PI * 0.95); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx + 13 * u, ey - 1, face === 'surprise' ? 2.4 : 1.9, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 鼻(大きなかぎ鼻)
    const ny = y0 + 42 * u;
    ctx.beginPath();
    ctx.moveTo(cx + 6 * u, ny - 7 * u);
    ctx.quadraticCurveTo(cx - 4 * u, ny - 2 * u, cx - 10 * u, ny + 1 * u);
    ctx.quadraticCurveTo(cx - 13 * u, ny + 6 * u, cx - 7 * u, ny + 6 * u);
    ctx.quadraticCurveTo(cx - 3 * u, ny + 8 * u, cx + 1 * u, ny + 5 * u);
    ctx.quadraticCurveTo(cx + 6 * u, ny + 5 * u, cx + 7 * u, ny + 1 * u);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - 6 * u, ny + 3 * u, 1.2, 0, Math.PI * 2); ctx.fill();

    // 口
    const my = y0 + 52 * u;
    ctx.beginPath();
    if (face === 'surprise') {
      ctx.ellipse(cx + 1, my, 3, 4, 0, 0, Math.PI * 2); ctx.stroke();
    } else if (face === 'sad') {
      ctx.moveTo(cx - 5, my + 2); ctx.quadraticCurveTo(cx, my - 3, cx + 5, my + 2); ctx.stroke();
    } else if (face === 'tehe') {
      ctx.moveTo(cx - 6, my - 1); ctx.quadraticCurveTo(cx, my + 4, cx + 6, my - 1); ctx.stroke();
      ctx.fillStyle = COL.pink; ctx.beginPath(); ctx.ellipse(cx + 2, my + 3, 3, 2.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    } else {
      // うれしい口(上がギザっとした開いた口)
      ctx.moveTo(cx - 6, my - 2); ctx.lineTo(cx - 2, my - 4); ctx.lineTo(cx + 1, my - 1); ctx.lineTo(cx + 4, my - 4); ctx.lineTo(cx + 6, my - 2);
      ctx.quadraticCurveTo(cx, my + 7, cx - 6, my - 2); ctx.closePath();
      ctx.fillStyle = COL.paper; ctx.fill(); ctx.stroke();
    }
    // ほっぺ
    if (face === 'happy' || face === 'tehe') {
      ctx.fillStyle = 'rgba(235,202,202,0.8)';
      ctx.beginPath(); ctx.ellipse(cx - 20 * u, my - 4, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx + 20 * u, my - 4, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  // ===== 障害物の描画 =====
  function drawObstacle(o) {
    line(2.5);
    if (o.type === 'lantern') {
      // 石灯籠
      const x = o.x, b = GROUND, w = o.w;
      ctx.fillStyle = COL.mid;
      rr(x + 4, b - 12, w - 8, 12, 2); ctx.fill(); ctx.stroke();               // 台
      rr(x + 13, b - 42, w - 26, 30, 2); ctx.fill(); ctx.stroke();             // 竿
      ctx.fillStyle = COL.light;
      rr(x + 6, b - 60, w - 12, 18, 2); ctx.fill(); ctx.stroke();              // 火袋
      ctx.fillStyle = '#f7e3a1'; ctx.fillRect(x + 15, b - 56, w - 30, 10); ctx.strokeRect(x + 15, b - 56, w - 30, 10);
      ctx.fillStyle = COL.mid;                                                  // 笠
      ctx.beginPath(); ctx.moveTo(x - 2, b - 60); ctx.lineTo(x + w / 2, b - 74); ctx.lineTo(x + w + 2, b - 60); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.arc(x + w / 2, b - 76, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); // 宝珠
      speckle(x + 4, b - 60, w - 8, 60, 25, 11);
    } else if (o.type === 'rocks') {
      // 石ころの山
      const x = o.x, b = GROUND, w = o.w, h = o.h;
      ctx.fillStyle = COL.mid;
      ctx.beginPath();
      ctx.moveTo(x, b); ctx.lineTo(x + w * 0.08, b - h * 0.55); ctx.lineTo(x + w * 0.3, b - h * 0.8);
      ctx.lineTo(x + w * 0.45, b - h); ctx.lineTo(x + w * 0.7, b - h * 0.85); ctx.lineTo(x + w * 0.92, b - h * 0.5); ctx.lineTo(x + w, b);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + w * 0.45, b - h); ctx.lineTo(x + w * 0.5, b - h * 0.4); ctx.lineTo(x + w * 0.3, b); ctx.stroke();
      speckle(x, b - h, w, h, 20, 5);
    } else if (o.type === 'crow') {
      // カラス
      const x = o.x, y = o.fy, f = Math.sin(o.flap) * 10;
      ctx.fillStyle = COL.dark;
      ctx.beginPath(); ctx.ellipse(x + 22, y, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + 8, y - 4, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e0a030'; ctx.beginPath(); ctx.moveTo(x + 2, y - 5); ctx.lineTo(x - 6, y - 2); ctx.lineTo(x + 2, y - 1); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 7, y - 6, 1.8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = COL.dark;
      ctx.beginPath(); ctx.moveTo(x + 16, y - 3); ctx.lineTo(x + 30, y - 18 - f); ctx.lineTo(x + 32, y - 2); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x + 36, y); ctx.lineTo(x + 46, y - 5); ctx.lineTo(x + 44, y + 4); ctx.closePath(); ctx.fill();
    }
  }

  function drawItem(it) {
    // 庵治石のかけら(キラキラ光る石)
    const y = it.y + Math.sin(it.t * 0.1) * 5, x = it.x;
    ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(it.t * 0.05) * 0.2);
    ctx.fillStyle = COL.paper; line(2);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(11, -4); ctx.lineTo(8, 11); ctx.lineTo(-8, 11); ctx.lineTo(-11, -4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.strokeStyle = COL.mid; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(0, 11); ctx.moveTo(-11, -4); ctx.lineTo(11, -4); ctx.stroke();
    ctx.restore();
    const tw = (Math.sin(it.t * 0.2) + 1) / 2;
    ctx.fillStyle = `rgba(242,201,76,${0.5 + tw * 0.5})`;
    star(x + 12, y - 12, 4 + tw * 2);
  }
  function star(x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr2 = i % 2 ? r * 0.35 : r; ctx.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
    ctx.closePath(); ctx.fill();
  }

  // ===== 背景 =====
  function drawBG() {
    const g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#f6f1e8'); g.addColorStop(1, '#ece5da');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // 雲
    ctx.fillStyle = '#ffffff';
    for (const c of S.clouds) {
      ctx.beginPath(); ctx.ellipse(c.x, c.y, 34 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + 20 * c.s, c.y - 8 * c.s, 22 * c.s, 12 * c.s, 0, 0, Math.PI * 2); ctx.fill();
    }
    // 遠くの山(五剣山っぽいギザギザ)
    ctx.fillStyle = '#d4cbbd';
    for (const h of S.hills) {
      ctx.beginPath(); ctx.moveTo(h.x, GROUND);
      const n = 5;
      for (let i = 0; i <= n; i++) ctx.lineTo(h.x + (h.w * i) / n, GROUND - 40 - h.h * (i % 2 ? 1 : 0.75) * Math.sin((i / n) * Math.PI) - 10);
      ctx.lineTo(h.x + h.w, GROUND); ctx.closePath(); ctx.fill();
    }
    // 地面(石畳)
    ctx.fillStyle = COL.light; ctx.fillRect(0, GROUND, W, H - GROUND);
    line(2.5); ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(W, GROUND); ctx.stroke();
    const off = (S.dist % 80);
    ctx.strokeStyle = 'rgba(46,46,46,0.25)'; ctx.lineWidth = 1.5;
    for (let row = 0; row < 3; row++) {
      const y = GROUND + 18 + row * 40;
      ctx.beginPath(); ctx.moveTo(0, y + 22); ctx.lineTo(W, y + 22); ctx.stroke();
      for (let x = -off + (row % 2) * 40; x < W + 80; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x, y + 22); ctx.stroke();
      }
    }
  }

  function drawHUD() {
    text(`${S.score}`, 20, 34, 30, COL.dark, 'left');
    text(`ベスト ${S.best}`, 20, 64, 15, '#6f675c', 'left', 'bold');
    // かけら数
    ctx.save(); ctx.translate(30, 92); ctx.scale(0.7, 0.7);
    ctx.fillStyle = COL.paper; line(2.5);
    ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(11, -4); ctx.lineTo(8, 11); ctx.lineTo(-8, 11); ctx.lineTo(-11, -4); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    text(`× ${S.stones}`, 44, 92, 16, COL.dark, 'left');
  }

  function panel(x, y, w, h) {
    ctx.fillStyle = 'rgba(244,241,236,0.96)'; rr(x, y, w, h, 18); ctx.fill(); line(3); ctx.stroke();
  }
  function wrapText(str, x, y, maxW, lh, size) {
    ctx.font = `bold ${size}px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",sans-serif`;
    let lineStr = '', yy = y;
    for (const ch of str) {
      if (ctx.measureText(lineStr + ch).width > maxW) { text(lineStr, x, yy, size); lineStr = ch; yy += lh; }
      else lineStr += ch;
    }
    if (lineStr) text(lineStr, x, yy, size);
  }

  function tapPill(label) {
    const sc = 1 + Math.sin(S.t * 0.1) * 0.04;
    ctx.save(); ctx.translate(W / 2, 640); ctx.scale(sc, sc);
    ctx.fillStyle = COL.dark; rr(-120, -26, 240, 52, 26); ctx.fill();
    text(label, 0, 1, 21, COL.paper);
    ctx.restore();
  }
  function drawTitle() {
    // タイトル
    ctx.save(); ctx.translate(W / 2, 120); ctx.rotate(-0.04);
    ctx.fillStyle = COL.light; rr(-150, 10, 300, 22, 11); ctx.fill();
    text('わらいしくん', 0, 0, 46);
    ctx.restore();
    text('ラン', W / 2, 172, 40, COL.dark);
    text('～ 庵治石のまちを走れ！ ～', W / 2, 214, 17, '#6f675c');
    // 遊び方
    panel(40, 250, W - 80, 150);
    text('あそびかた', W / 2, 276, 17);
    text('画面タップでジャンプ！', W / 2, 308, 16, COL.dark, 'center', 'normal');
    text('空中でもう1回タップで2段ジャンプ', W / 2, 334, 15, COL.dark, 'center', 'normal');
    text('灯籠・石ころ・カラスをよけて', W / 2, 360, 15, COL.dark, 'center', 'normal');
    text('庵治石のかけら ✦ を集めよう(+50)', W / 2, 384, 15, COL.dark, 'center', 'normal');
    if (S.best > 0) text(`ベストスコア ${S.best}`, W / 2, 430, 16, '#6f675c');
    tapPill('タップしてスタート');
  }

  function drawOver() {
    ctx.fillStyle = 'rgba(46,46,46,0.25)'; ctx.fillRect(0, 0, W, H);
    panel(30, 120, W - 60, 380);
    text('へこむ～…', W / 2, 160, 30);
    text('スコア', W / 2, 205, 16, '#6f675c');
    text(`${S.score}`, W / 2, 245, 48);
    if (S.newBest) {
      ctx.fillStyle = COL.pink; rr(W / 2 - 70, 278, 140, 28, 14); ctx.fill();
      text('ベスト更新！', W / 2, 292, 16);
    } else text(`ベスト ${S.best}`, W / 2, 292, 16, '#6f675c');
    text(`走ったきょり ${Math.floor(S.dist / 10)}m ／ かけら ${S.stones}こ`, W / 2, 325, 14, COL.dark, 'center', 'normal');
    // まめちしき
    ctx.fillStyle = COL.light; rr(50, 348, W - 100, 120, 12); ctx.fill();
    text('庵治石まめちしき', W / 2, 368, 14, '#6f675c');
    wrapText(S.trivia, W / 2, 398, W - 130, 24, 15);
    if (S.overT > 40) {
      tapPill('タップでもう一回！');
    }
  }

  function draw() {
    ctx.save();
    if (S.shake > 0) ctx.translate((Math.random() - 0.5) * S.shake, (Math.random() - 0.5) * S.shake);
    drawBG();
    for (const it of S.items) drawItem(it);
    for (const o of S.obstacles) drawObstacle(o);
    if (S.mode === 'title') {
      drawWaraishi(W / 2, GROUND, Math.floor(S.t / 120) % 4 === 3 ? 'tehe' : 'happy', P.run, 0);
    } else {
      drawWaraishi(P.x, P.y, P.face, P.run, P.squash);
    }
    for (const p of S.particles) {
      ctx.globalAlpha = Math.max(0, p.life / 30); ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    if (S.mode === 'play') drawHUD();
    if (S.mode === 'title') drawTitle();
    if (S.mode === 'over') drawOver();
  }

  // ===== メインループ(60fps固定ステップ) =====
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(100, now - last); last = now;
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
